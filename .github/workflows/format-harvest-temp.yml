name: Temporary Harvest CSS formatter

on:
  push:
    branches:
      - feat/harvest-rush-campaign-upgrade

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format the game stylesheet with the pinned Prettier version
        run: |
          npx prettier app/styles/pages/play.css --write
          echo "=== PRETTIER_OUTPUT_BEGIN ==="
          cat app/styles/pages/play.css
          echo "=== PRETTIER_OUTPUT_END ==="
