name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The single build-matrix leg whose output is deployed. Named once so the
  # Pages-configure gate and the artifact-upload gate cannot drift apart —
  # they are a pair, and a mismatch produces a green CI run with nothing to
  # deploy. Must stay in step with .nvmrc; the build job asserts that.
  DEPLOY_NODE: '26.x'

# A new group version lets the corrected publish workflow proceed even if an
# earlier main run is waiting indefinitely for a hosted runner. The Pages job
# below continues to serialize actual deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-publish-v2
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Lint, format, and type check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Generate profile-specific artwork
        run: npm run icons && npm run og

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      # Regenerate the profile-bound icon and share-card assets above so a fork
      # never ships the upstream owner's artwork. The ledger and pixel checks
      # then verify the generated output against the current source and tokens.
      - name: Verify share-card ledger
        run: npm run og:check:ledger

      - name: Verify share cards against a fresh render
        run: npm run og:check:render

  # Run tests
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Generate profile-specific artwork
        run: npm run icons && npm run og

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Build on Linux and Windows across the supported Node versions. macOS is
  # not a production target for this static export, so runner availability
  # there must not block a GitHub Pages release.
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Configure Pages only reads the existing site metadata. Application and
    # dependency code must never run with Pages write permissions.
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest major package.json engines allows (at its newest release,
        # not the declared floor), and the version .nvmrc pins for development
        # and the rest of CI.
        node-version: [22.x, 26.x]
        os: [ubuntu-latest, windows-latest]
        exclude:
          # Reduce matrix size for faster CI. Non-Linux runners only need to
          # prove the build is portable, so they run the deployed version.
          - os: windows-latest
            node-version: 22.x
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Snake game remains in its own public repository. Build it only on
      # Linux runners and include its static output in the Pages export.
      - name: Check out Snakegame source
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mohammerd/Snakegame
          ref: main
          path: snakegame-source
          persist-credentials: false

      - name: Build Snakegame static app
        if: matrix.os == 'ubuntu-latest'
        working-directory: snakegame-source
        run: npm ci && npm run typecheck && npm run build

      - name: Include Snakegame in the static website
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/copy-snakegame.mjs

      # Every matrix leg runs the export verifier, which checks that each
      # published post's generated OpenGraph image is present in out/. The
      # image is generated from the Markdown source, so it must exist in each
      # runner's workspace, not only the Ubuntu deployment candidate.
      - name: Generate profile-specific share cards
        run: npm run og

      # Everything except this job takes its Node from .nvmrc, but a matrix
      # needs literals. If the two drift, the deploy leg stops being built and
      # main fails only after CI reports success. Catch it here, on the PR.
      - name: Check deploy candidate matches .nvmrc
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pinned="$(tr -d 'v[:space:]' < .nvmrc | cut -d. -f1)"
          wanted="${DEPLOY_NODE%%.*}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::error file=.nvmrc::.nvmrc pins Node $pinned but DEPLOY_NODE is $DEPLOY_NODE. Update both, and the build matrix."
            exit 1
          fi
          echo "Deploy candidate Node $wanted matches .nvmrc."

      # This matrix entry becomes the deployment candidate on main. `homepage`
      # in package.json is the site's one public URL: Next's base path and
      # every published address derive from it. Reading the Pages settings
      # first fails the deployment, with the fix, when the two disagree, as
      # in a fork that still names the upstream site.
      - name: Read GitHub Pages settings
        id: pages
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false

      - name: Check homepage is the GitHub Pages URL
        if: steps.pages.outcome == 'success'
        run: node scripts/check-pages-url.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      # The other Linux leg builds the site as a fork publishes it at
      # https://USER.github.io/REPO/, so the export gates below fail on any
      # address that misses the base path. `homepage` is all it changes.
      - name: Use a project-site URL
        if: matrix.os == 'ubuntu-latest' && matrix.node-version != env.DEPLOY_NODE
        run: npm pkg set homepage=https://example.github.io/personal-site/

      # The Test job above already regenerates the profile assets at the root
      # URL. This leg has its own checkout, so regenerate them here as well
      # before the tests run under the project-site base path.
      - name: Generate profile-specific artwork for project-site tests
        if: matrix.os == 'ubuntu-latest' && matrix.node-version != env.DEPLOY_NODE
        run: npm run icons && npm run og

      # The Test job runs at the upstream root URL, so a test that assumes one
      # passes there and blocks a fork's first deployment. Run the suite again
      # as the fork's own Test job will.
      - name: Test at the project-site URL
        if: matrix.os == 'ubuntu-latest' && matrix.node-version != env.DEPLOY_NODE
        run: npm test

      # Stats use the public API anonymously, falling back to last-known floors
      # on rate limits. Do not expose a job token to application/dependency code.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ vars.NEXT_PUBLIC_GA_TRACKING_ID }}

      # Checks generated HTML/XML itself: leaked drafts, robots, duplicate ids,
      # fragment and route targets, canonical/share metadata, local images, and
      # sitemap/RSS integrity. None of these are visible to component tests.
      - name: Verify export
        run: npm run verify-export

      # Weighs what Pages actually serves, most of which is not JavaScript, and
      # fails when a subsystem crosses the ratchet in scripts/budget.json. The
      # budgets carry documented headroom so ordinary changes stay green; a
      # deliberate increase is `--update-budget` plus a note in the pull request.
      - name: Measure export against size budget
        run: npm run measure-export

      # Loads every exported page in headless Chrome at a 320px phone width,
      # at the default text size and at 200%, and at 1280px, and fails when a
      # page is wider than its viewport. jsdom has no layout, so no component
      # test can see this. One leg is enough: the fonts are self-hosted, so the
      # other platforms lay the pages out the same way.
      - name: Check pages fit narrow screens and enlarged text
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == env.DEPLOY_NODE
        run: npm run check-reflow

      # Upload Pages content from the build job. Deployment runs in a
      # separate job so the artifact service has completed the build-job
      # artifact listing before deploy-pages asks for it.
      - name: Upload site for GitHub Pages
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: out/

  # Summary job to ensure all checks pass
  ci-success:
    name: CI Success
    needs: [code-quality, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" || 
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # Publish exactly the Linux/DEPLOY_NODE artifact that passed the complete CI
  # graph. Manual runs are intentionally deployable only from main.
  deploy:
    name: Deploy to GitHub Pages
    needs: ci-success
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages artifact is uploaded by the build job, not here. This
      # cross-job boundary avoids querying the artifact service immediately
      # after an upload in the same job.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
